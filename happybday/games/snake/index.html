<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake Game 🐍</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

html, body {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background-color: #05071a;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: #ffffff;
    touch-action: none;
}

body {
    background-color: #05071a;
    background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.14) 0%, transparent 60%),
        linear-gradient(180deg, #05071a 0%, #090c28 100%);
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game-wrapper {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px 12px;
    touch-action: none;
}

/* Top HUD */
.hud-top {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
}

.scores-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.score-pill {
    background: rgba(8, 12, 38, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid rgba(0, 240, 255, 0.5);
    border-radius: 50px;
    padding: 5px 16px;
    font-size: clamp(14px, 4vw, 17px);
    font-weight: 700;
    color: #00f0ff;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 10px rgba(0, 240, 255, 0.25);
}

.score-pill.hiscore {
    color: #ffd700;
    border-color: rgba(255, 215, 0, 0.6);
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 10px rgba(255, 215, 0, 0.25);
}

/* Difficulty Switcher */
.difficulty-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(8, 12, 38, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 0, 127, 0.4);
    border-radius: 50px;
    padding: 4px 6px 4px 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
}

.diff-badge {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 600;
}

.diff-badge strong {
    color: #ff007f;
    text-shadow: 0 0 8px rgba(255, 0, 127, 0.8);
}

.diff-pills {
    display: flex;
    gap: 4px;
}

.diff-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: rgba(255, 255, 255, 0.75);
    font-size: 11px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.diff-btn:hover {
    background: rgba(255, 0, 127, 0.2);
    color: #ffffff;
}

.diff-btn.active {
    background: linear-gradient(135deg, #ff007f 0%, #a855f7 100%);
    color: #ffffff;
    border-color: rgba(255, 255, 255, 0.7);
    box-shadow: 0 2px 12px rgba(255, 0, 127, 0.7);
    transform: scale(1.04);
}

/* Board */
.board-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    max-height: 48vh;
    margin: 2px 0;
    touch-action: none;
}

#board {
    background-color: #070a22;
    background-image: 
        linear-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.08) 1px, transparent 1px);
    background-size: calc(min(47vh, 88vw) / 15) calc(min(47vh, 88vw) / 15);
    width: min(47vh, 88vw);
    height: min(47vh, 88vw);
    border: 2.5px solid #00f0ff;
    border-radius: 14px;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 25px rgba(255, 0, 127, 0.2);
    display: grid;
    grid-template-rows: repeat(15, 1fr);
    grid-template-columns: repeat(15, 1fr);
    position: relative;
    overflow: hidden;
    touch-action: none;
}

/* Big Square Snake Head with Image & Neon Glow */
.head {
    background-color: #00f0ff;
    background-image: url('img/snake.jpg');
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    border: 2.5px solid #ffffff;
    border-radius: 6px;
    transform: scale(1.5);
    z-index: 5;
    box-shadow: 0 0 16px #00f0ff, 0 0 32px rgba(0, 240, 255, 0.85);
}

/* Big Square Snake Body with Image & Neon Glow */
.snake {
    background-color: #ff007f;
    background-image: url('img/snake.jpg');
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    border-radius: 5px;
    transform: scale(1.28);
    z-index: 4;
    box-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
}

/* Big Square Food with Image & Pulsing Neon Radiance */
.food {
    background-color: #ffea00;
    background-image: url('img/food.jpg');
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    border: 2.5px solid #ffffff;
    border-radius: 6px;
    transform: scale(1.6);
    animation: foodGlow 0.9s ease-in-out infinite alternate;
    z-index: 6;
}

@keyframes foodGlow {
    from { 
        transform: scale(1.48); 
        box-shadow: 0 0 14px #ffea00, 0 0 28px rgba(255, 0, 85, 0.8); 
    }
    to { 
        transform: scale(1.72); 
        box-shadow: 0 0 24px #ffea00, 0 0 45px rgba(255, 0, 85, 1); 
    }
}

/* Virtual Joystick Section */
.joystick-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    touch-action: none;
}

.joystick-base {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(8, 12, 38, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2.5px solid rgba(0, 240, 255, 0.6);
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 240, 255, 0.25);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: pointer;
}

.j-dir {
    position: absolute;
    color: rgba(0, 240, 255, 0.7);
    font-size: 15px;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.9);
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.j-dir:active {
    color: #ffffff;
    text-shadow: 0 0 12px #ff007f;
}
.j-up { top: 2px; left: 50%; transform: translateX(-50%); }
.j-down { bottom: 2px; left: 50%; transform: translateX(-50%); }
.j-left { left: 4px; top: 50%; transform: translateY(-50%); }
.j-right { right: 4px; top: 50%; transform: translateY(-50%); }

.joystick-knob {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00f0ff 0%, #ff007f 100%);
    border: 2.5px solid #ffffff;
    box-shadow: 0 0 22px rgba(0, 240, 255, 0.9), 0 4px 20px rgba(255, 0, 127, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: transform 0.05s ease-out;
}

.knob-ring {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 10px rgba(255, 255, 255, 1);
}

.joystick-hint {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.8);
    letter-spacing: 0.3px;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
}
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- Top HUD Header -->
        <div class="hud-top">
            <div class="scores-row">
                <div class="score-pill" id="scoreBox">Score: 0</div>
                <div class="score-pill hiscore" id="hiscoreBox">HiScore: 0</div>
            </div>

            <!-- Difficulty Switcher with Active Highlight -->
            <div class="difficulty-wrap">
                <div class="diff-badge">Mode: <strong id="current-difficulty">Medium</strong></div>
                <div class="diff-pills" id="diff-group">
                    <button class="diff-btn" id="easy" data-diff="Easy">🌸 Easy</button>
                    <button class="diff-btn active" id="medium" data-diff="Medium">⚡ Medium</button>
                    <button class="diff-btn" id="hard" data-diff="Hard">🔥 Hard</button>
                </div>
            </div>
        </div>

        <!-- Snake Board -->
        <div class="board-container">
            <div id="board"></div>
        </div>

        <!-- Virtual Joystick Controls -->
        <div class="joystick-section">
            <div class="joystick-base" id="joystick-base">
                <span class="j-dir j-up">▲</span>
                <span class="j-dir j-right">►</span>
                <span class="j-dir j-down">▼</span>
                <span class="j-dir j-left">◄</span>
                <div class="joystick-knob" id="joystick-knob">
                    <div class="knob-ring"></div>
                </div>
            </div>
            <div class="joystick-hint">Drag or tap Joystick to steer 🎮</div>
        </div>
    </div>

    <script src="js/index.js"></script>
    <script>
// Image Configuration (Square tiles with original images)
const imageConfig = {
    useImages: true,
    snakeHead: 'img/snake.jpg',
    snakeBody: 'img/snake.jpg',
    food: 'img/food.jpg'
};

// Game Constants & Variables
let inputDir = { x: 0, y: 0 };
const foodSound = new Audio('music/food.mp3');
const gameOverSound = new Audio('music/gameover.mp3');
const moveSound = new Audio('music/move.mp3');
const musicSound = new Audio('music/music.mp3');
let speed = 9;
let score = 0;
let lastPaintTime = 0;
let snakeArr = [{ x: 8, y: 8 }];
let food = { x: 4, y: 5 };

const board = document.getElementById('board');
const scoreBox = document.getElementById('scoreBox');
const hiscoreBox = document.getElementById('hiscoreBox');
const currentDifficultyEl = document.getElementById('current-difficulty');

// Game Loop
function main(ctime) {
    window.requestAnimationFrame(main);
    if ((ctime - lastPaintTime) / 1000 < 1 / speed) {
        return;
    }
    lastPaintTime = ctime;
    gameEngine();
}

function isCollide(snake) {
    // Self collision
    for (let i = 1; i < snakeArr.length; i++) {
        if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
            return true;
        }
    }
    // Wall collision (15x15 board)
    if (snake[0].x >= 16 || snake[0].x <= 0 || snake[0].y >= 16 || snake[0].y <= 0) {
        return true;
    }
    return false;
}

function gameEngine() {
    // 1. Collision Check
    if (isCollide(snakeArr)) {
        try { gameOverSound.play(); } catch(e){}
        try { musicSound.pause(); } catch(e){}
        inputDir = { x: 0, y: 0 };
        snakeArr = [{ x: 8, y: 8 }];
        score = 0;
        scoreBox.innerHTML = "Score: 0";
    }

    // 2. Food Eating
    if (snakeArr[0].y === food.y && snakeArr[0].x === food.x) {
        try { foodSound.play(); } catch(e){}
        score += 1;
        if (score > hiscoreval) {
            hiscoreval = score;
            localStorage.setItem("hiscore", JSON.stringify(hiscoreval));
            hiscoreBox.innerHTML = "HiScore: " + hiscoreval;
        }
        scoreBox.innerHTML = "Score: " + score;
        snakeArr.unshift({ x: snakeArr[0].x + inputDir.x, y: snakeArr[0].y + inputDir.y });
        let a = 2;
        let b = 14;
        food = { x: Math.round(a + (b - a) * Math.random()), y: Math.round(a + (b - a) * Math.random()) };
    }

    // 3. Moving the Snake
    if (inputDir.x !== 0 || inputDir.y !== 0) {
        for (let i = snakeArr.length - 2; i >= 0; i--) {
            snakeArr[i + 1] = { ...snakeArr[i] };
        }
        snakeArr[0].x += inputDir.x;
        snakeArr[0].y += inputDir.y;
    }

    // 4. Render
    board.innerHTML = "";
    snakeArr.forEach((e, index) => {
        const snakeElement = document.createElement('div');
        snakeElement.style.gridRowStart = e.y;
        snakeElement.style.gridColumnStart = e.x;

        if (index === 0) {
            snakeElement.classList.add('head');
            if (imageConfig.useImages && imageConfig.snakeHead) {
                snakeElement.style.backgroundImage = 'url("' + imageConfig.snakeHead + '")';
            }
        } else {
            snakeElement.classList.add('snake');
            if (imageConfig.useImages && imageConfig.snakeBody) {
                snakeElement.style.backgroundImage = 'url("' + imageConfig.snakeBody + '")';
            }
        }
        board.appendChild(snakeElement);
    });

    // Display Food
    const foodElement = document.createElement('div');
    foodElement.style.gridRowStart = food.y;
    foodElement.style.gridColumnStart = food.x;
    foodElement.classList.add('food');
    if (imageConfig.useImages && imageConfig.food) {
        foodElement.style.backgroundImage = 'url("' + imageConfig.food + '")';
    }
    board.appendChild(foodElement);
}

// Direction Handler
function handleDirection(x, y) {
    if (inputDir.x === 0 && inputDir.y === 0) {
        inputDir = { x: x, y: y };
        try { moveSound.play(); } catch(e){}
        return;
    }
    // Prevent 180 reverse only when snake has segments behind it
    if (snakeArr.length > 1) {
        if (x !== 0 && inputDir.x === -x) return;
        if (y !== 0 && inputDir.y === -y) return;
    }
    inputDir = { x: x, y: y };
    try { moveSound.play(); } catch(e){}
}

// Keyboard controls
window.addEventListener('keydown', e => {
    switch (e.key) {
        case "ArrowUp":
        case "w":
        case "W":
            handleDirection(0, -1);
            e.preventDefault();
            break;
        case "ArrowDown":
        case "s":
        case "S":
            handleDirection(0, 1);
            e.preventDefault();
            break;
        case "ArrowLeft":
        case "a":
        case "A":
            handleDirection(-1, 0);
            e.preventDefault();
            break;
        case "ArrowRight":
        case "d":
        case "D":
            handleDirection(1, 0);
            e.preventDefault();
            break;
    }
});

// Difficulty Switcher Buttons
const diffButtons = document.querySelectorAll('.diff-btn');
diffButtons.forEach(btn => {
    btn.addEventListener('click', function() {
        diffButtons.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const mode = this.getAttribute('data-diff');
        currentDifficultyEl.textContent = mode;
        if (mode === 'Easy') speed = 5.5;
        else if (mode === 'Medium') speed = 9.5;
        else if (mode === 'Hard') speed = 15;
    });
});

// Virtual Pointer Joystick & Direction Arrows
(function setupJoystick() {
    const base = document.getElementById('joystick-base');
    const knob = document.getElementById('joystick-knob');
    if (!base || !knob) return;

    let activePointerId = null;
    const maxRadius = 38;

    function getCenter() {
        const rect = base.getBoundingClientRect();
        return {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2
        };
    }

    function processPointer(clientX, clientY) {
        const center = getCenter();
        const dx = clientX - center.x;
        const dy = clientY - center.y;
        const dist = Math.hypot(dx, dy);

        let clampedX = dx;
        let clampedY = dy;
        if (dist > maxRadius) {
            clampedX = (dx / dist) * maxRadius;
            clampedY = (dy / dist) * maxRadius;
        }

        knob.style.transform = 'translate(' + clampedX + 'px, ' + clampedY + 'px)';

        // Angle-based direction calculation with 8px deadzone
        if (dist > 8) {
            const angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
            if (angleDeg >= -45 && angleDeg <= 45) {
                handleDirection(1, 0); // Right
            } else if (angleDeg > 45 && angleDeg < 135) {
                handleDirection(0, 1); // Down
            } else if (angleDeg >= 135 || angleDeg <= -135) {
                handleDirection(-1, 0); // Left
            } else if (angleDeg > -135 && angleDeg < -45) {
                handleDirection(0, -1); // Up
            }
        }
    }

    // Pointer Events with PointerCapture
    base.addEventListener('pointerdown', function(e) {
        activePointerId = e.pointerId;
        try { base.setPointerCapture(e.pointerId); } catch(err){}
        processPointer(e.clientX, e.clientY);
        e.preventDefault();
    });

    base.addEventListener('pointermove', function(e) {
        if (activePointerId === e.pointerId) {
            processPointer(e.clientX, e.clientY);
            e.preventDefault();
        }
    });

    function resetJoystick(e) {
        if (activePointerId === e.pointerId || activePointerId !== null) {
            activePointerId = null;
            knob.style.transform = 'translate(0px, 0px)';
        }
    }

    base.addEventListener('pointerup', resetJoystick);
    base.addEventListener('pointercancel', resetJoystick);
    base.addEventListener('lostpointercapture', resetJoystick);

    // Direct Direction Arrow Taps
    document.querySelector('.j-up')?.addEventListener('pointerdown', (e) => { e.stopPropagation(); handleDirection(0, -1); });
    document.querySelector('.j-down')?.addEventListener('pointerdown', (e) => { e.stopPropagation(); handleDirection(0, 1); });
    document.querySelector('.j-left')?.addEventListener('pointerdown', (e) => { e.stopPropagation(); handleDirection(-1, 0); });
    document.querySelector('.j-right')?.addEventListener('pointerdown', (e) => { e.stopPropagation(); handleDirection(1, 0); });
})();

// Touch Swipe Gesture on Board
(function setupSwipeControls() {
    let startX = 0;
    let startY = 0;
    const threshold = 18;

    board.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches[0]) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }
    }, { passive: true });

    board.addEventListener('touchend', function(e) {
        if (e.changedTouches && e.changedTouches[0]) {
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);

            if (Math.max(absX, absY) > threshold) {
                if (absX > absY) {
                    if (dx > 0) handleDirection(1, 0);
                    else handleDirection(-1, 0);
                } else {
                    if (dy > 0) handleDirection(0, 1);
                    else handleDirection(0, -1);
                }
            }
        }
    }, { passive: true });
})();

// HiScore setup & Start
let hiscore = localStorage.getItem("hiscore");
let hiscoreval = 0;
if (hiscore !== null) {
    hiscoreval = JSON.parse(hiscore);
    hiscoreBox.innerHTML = "HiScore: " + hiscoreval;
} else {
    localStorage.setItem("hiscore", JSON.stringify(0));
}

window.requestAnimationFrame(main);
    </script>
</body>
