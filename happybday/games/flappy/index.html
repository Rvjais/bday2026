<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Adventure 🕊️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #70c5ce;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        
        #game-canvas {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #70c5ce;
            display: block;
            touch-action: none;
        }
        
        .score-display {
            position: absolute;
            top: 5vh;
            left: 0;
            right: 0;
            text-align: center;
            font-size: clamp(36px, 8vh, 64px);
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.6);
            z-index: 10;
            pointer-events: none;
        }
        
        .start-screen {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: rgba(5, 8, 39, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 50;
            cursor: pointer;
            padding: 24px;
            gap: 16px;
        }
        
        .start-screen h1 {
            font-size: clamp(28px, 7vh, 46px);
            font-weight: 800;
            text-shadow: 0 4px 18px rgba(255, 105, 180, 0.6);
            color: #ffd1dc;
        }
        
        .start-screen p {
            font-size: clamp(14px, 3vh, 18px);
            max-width: 380px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.85);
        }

        .start-badge {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: #ffffff;
            font-size: clamp(15px, 3.5vw, 18px);
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 50px;
            box-shadow: 0 6px 25px rgba(255, 20, 147, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.7);
            margin-top: 8px;
            animation: pulseBtn 1.5s infinite alternate;
        }

        @keyframes pulseBtn {
            from { transform: scale(0.98); }
            to { transform: scale(1.05); }
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(8, 12, 38, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 192, 203, 0.5);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 105, 180, 0.3);
            color: white;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            z-index: 60;
            display: none;
            width: 85%;
            max-width: 360px;
            cursor: pointer;
        }
        
        .game-over h2 {
            font-size: 26px;
            color: #ff69b4;
            margin-bottom: 12px;
        }
        
        .game-over p {
            font-size: 18px;
            margin-bottom: 16px;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 20, 147, 0.6);
        }

        #mobile-flap-btn {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.85) 0%, rgba(255, 20, 147, 0.95) 100%);
            border: 3px solid #ffffff;
            box-shadow: 0 6px 25px rgba(255, 20, 147, 0.7);
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
            touch-action: none;
        }
        .game-active #mobile-flap-btn {
            display: flex;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    
    <div class="score-display" id="score">0</div>
    
    <div class="start-screen" id="start-screen">
        <h1>Flappy Adventure 🕊️</h1>
        <p>Tap anywhere or press Space to fly!<br>Avoid the pipes and set a high score ✨</p>
        <div class="start-badge">▶ Tap to Start Game</div>
    </div>
    
    <div class="game-over" id="game-over">
        <h2>Game Over! 🌸</h2>
        <p>Score: <span id="final-score">0</span></p>
        <button class="restart-btn" id="restart-btn">Play Again ↺</button>
    </div>
    
    <div id="mobile-flap-btn">FLAP</div>

    <audio id="background-music" loop>
        <source src="music.m4a" type="audio/mp4">
    </audio>
    <audio id="game-over-music">
        <source src="over.m4a" type="audio/mp4">
    </audio>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const finalScoreDisplay = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');
        const startScreen = document.getElementById('start-screen');
        const mobileFlapBtn = document.getElementById('mobile-flap-btn');
        const backgroundMusic = document.getElementById('background-music');
        const gameOverMusic = document.getElementById('game-over-music');

        let gameRunning = false;
        let gameStarted = false;
        let score = 0;
        let frames = 0;
        let animationId;

        // Dynamic size calculations
        function getSizes() {
            const isMobile = window.innerWidth <= 768;
            const baseSize = Math.min(canvas.width, canvas.height);
            return {
                birdSize: Math.max(38, Math.min(60, baseSize / 10)),
                pipeWidth: Math.max(55, Math.min(90, baseSize / 6)),
                pipeGap: Math.max(140, baseSize * 0.28),
                groundHeight: Math.max(60, canvas.height * 0.12),
                pipeSpeed: Math.max(2.2, canvas.width / 160),
                gravity: 0.28,
                jump: -5.8
            };
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            sizes = getSizes();
            if (bird && bird.reset) {
                bird.reset();
            }
        }
        window.addEventListener('resize', resizeCanvas);

        // Preload Images
        const birdImg = new Image();
        birdImg.src = 'bird.jpeg';
        birdImg.onerror = function() {
            birdImg.src = 'snake.jpg';
        };

        const pipeImg = new Image();
        pipeImg.src = 'pipe.png';

        let sizes = {
            birdSize: 45,
            pipeWidth: 70,
            pipeGap: 160,
            groundHeight: 70,
            pipeSpeed: 2.8,
            gravity: 0.28,
            jump: -5.8
        };

        // Bird Object
        const bird = {
            x: 50,
            y: 200,
            width: 45,
            height: 45,
            velocity: 0,

            draw: function() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                
                // Draw custom bird image
                if (birdImg && birdImg.complete && birdImg.naturalWidth !== 0) {
                    ctx.drawImage(birdImg, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = '#ff69b4';
                    ctx.fill();
                }
                ctx.restore();

                // Draw glowing avatar ring
                ctx.save();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#ff69b4';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            },

            flap: function() {
                this.velocity = sizes.jump;
            },

            update: function() {
                this.velocity += sizes.gravity;
                this.y += this.velocity;

                // Ground collision
                if (this.y + this.height >= canvas.height - sizes.groundHeight) {
                    gameOver();
                    return;
                }

                // Ceiling clamp
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },

            reset: function() {
                this.x = Math.max(40, canvas.width * 0.2);
                this.y = canvas.height * 0.4;
                this.velocity = 0;
                this.width = sizes.birdSize;
                this.height = sizes.birdSize;
            }
        };

        // Pipes Object
        const pipes = {
            position: [],

            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];

                    // Top pipe (flipped)
                    ctx.save();
                    ctx.translate(p.x, p.y + p.height);
                    ctx.scale(1, -1);
                    if (pipeImg && pipeImg.complete && pipeImg.naturalWidth !== 0) {
                        ctx.drawImage(pipeImg, 0, 0, p.width, p.height);
                    } else {
                        ctx.fillStyle = '#22c55e';
                        ctx.fillRect(0, 0, p.width, p.height);
                    }
                    ctx.restore();

                    // Bottom pipe
                    if (pipeImg && pipeImg.complete && pipeImg.naturalWidth !== 0) {
                        ctx.drawImage(pipeImg, p.x, p.y + sizes.pipeGap + p.height, p.width, p.height);
                    } else {
                        ctx.fillStyle = '#22c55e';
                        ctx.fillRect(p.x, p.y + sizes.pipeGap + p.height, p.width, p.height);
                    }
                }
            },

            update: function() {
                const pipeInterval = window.innerWidth <= 768 ? 105 : 95;
                if (frames % pipeInterval === 0) {
                    const pipeHeight = canvas.height * 0.55;
                    const minPipeY = -pipeHeight * 0.75;
                    const maxPipeY = -pipeHeight * 0.2;

                    this.position.push({
                        x: canvas.width,
                        y: minPipeY + (maxPipeY - minPipeY) * Math.random(),
                        width: sizes.pipeWidth,
                        height: pipeHeight,
                        passed: false
                    });
                }

                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    p.x -= sizes.pipeSpeed;

                    // Score
                    if (p.x + p.width < bird.x && !p.passed) {
                        score++;
                        scoreDisplay.textContent = score;
                        p.passed = true;
                    }

                    // Collision
                    let birdRight = bird.x + bird.width;
                    let birdBottom = bird.y + bird.height;
                    let pipeRight = p.x + p.width;
                    let topPipeBottom = p.y + p.height;
                    let bottomPipeTop = p.y + sizes.pipeGap + p.height;

                    if (bird.x < pipeRight && birdRight > p.x && (bird.y < topPipeBottom || birdBottom > bottomPipeTop)) {
                        gameOver();
                        return;
                    }

                    // Remove off-screen
                    if (p.x + p.width < 0) {
                        this.position.shift();
                        i--;
                    }
                }
            },

            reset: function() {
                this.position = [];
            }
        };

        // Background
        const bg = {
            draw: function() {
                // Sky
                ctx.fillStyle = '#70c5ce';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Clouds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.2, canvas.height * 0.2, 35, 0, Math.PI * 2);
                ctx.arc(canvas.width * 0.28, canvas.height * 0.17, 45, 0, Math.PI * 2);
                ctx.arc(canvas.width * 0.35, canvas.height * 0.2, 35, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(canvas.width * 0.7, canvas.height * 0.25, 40, 0, Math.PI * 2);
                ctx.arc(canvas.width * 0.78, canvas.height * 0.22, 50, 0, Math.PI * 2);
                ctx.arc(canvas.width * 0.86, canvas.height * 0.25, 40, 0, Math.PI * 2);
                ctx.fill();

                // Ground
                ctx.fillStyle = '#ded895';
                ctx.fillRect(0, canvas.height - sizes.groundHeight, canvas.width, sizes.groundHeight);

                // Grass stripe
                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(0, canvas.height - sizes.groundHeight, canvas.width, 14);
            }
        };

        function draw() {
            bg.draw();
            pipes.draw();
            bird.draw();
        }

        function update() {
            bird.update();
            if (gameRunning) {
                pipes.update();
            }
        }

        function loop() {
            update();
            draw();
            frames++;
            if (gameRunning) {
                animationId = requestAnimationFrame(loop);
            }
        }

        function startGame() {
            if (gameRunning) return;
            startScreen.style.display = 'none';
            document.body.classList.add('game-active');
            score = 0;
            frames = 0;
            scoreDisplay.textContent = score;
            gameOverScreen.style.display = 'none';
            bird.reset();
            pipes.reset();
            gameRunning = true;
            gameStarted = true;

            try {
                backgroundMusic.currentTime = 0;
                backgroundMusic.play().catch(e => {});
            } catch (e) {}

            loop();
        }

        function gameOver() {
            if (!gameRunning) return;
            gameRunning = false;
            cancelAnimationFrame(animationId);
            document.body.classList.remove('game-active');

            setTimeout(() => {
                gameOverScreen.style.display = 'block';
                finalScoreDisplay.textContent = score;
                try {
                    gameOverMusic.currentTime = 0;
                    gameOverMusic.play().catch(e => {});
                } catch (e) {}
            }, 300);

            try {
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
            } catch (e) {}
        }

        function flapBird() {
            if (gameRunning) {
                bird.flap();
            } else if (gameStarted) {
                startGame();
            } else {
                startGame();
            }
        }

        // Event Listeners
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
                flapBird();
                e.preventDefault();
            }
        });

        // Pointer controls on canvas, start screen, game over, and flap button
        startScreen.addEventListener('pointerdown', function(e) { flapBird(); e.preventDefault(); });
        canvas.addEventListener('pointerdown', function(e) { flapBird(); e.preventDefault(); });
        mobileFlapBtn.addEventListener('pointerdown', function(e) { flapBird(); e.preventDefault(); });
        document.getElementById('restart-btn').addEventListener('pointerdown', function(e) { startGame(); e.preventDefault(); });

        // Immediate initialization
        function init() {
            resizeCanvas();
            draw();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
